<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#fafafa"/>
  <!-- 相互垂直的正弦 -->
  <g fill="none" stroke-width="2">
    <!-- x 分量（顶部） -->
    <path d="M 60 70 Q 100 40 140 70 T 220 70" stroke="#f472b6" opacity="0.7"/>
    <circle cx="140" cy="70" r="4" fill="#f472b6"/>
    <!-- y 分量（左侧） -->
    <path d="M 60 110 Q 30 150 60 190 T 60 250" stroke="#34d399" opacity="0.7"/>
    <circle cx="60" cy="170" r="4" fill="#34d399"/>
  </g>
  <!-- 利萨加曲线 3:2 -->
  <path d="M 200 170
           C 220 100, 280 100, 300 170
           C 320 240, 260 240, 240 170
           C 230 128, 260 128, 280 170
           M 200 170
           C 180 100, 120 100, 100 170
           C 80 240, 140 240, 160 170
           C 170 128, 140 128, 120 170"
        fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0.85"/>
  <!-- 结点标记 -->
  <g fill="#f59e0b">
    <circle cx="200" cy="170" r="5"/>
    <circle cx="300" cy="170" r="5"/>
    <circle cx="100" cy="170" r="5"/>
  </g>
  <!-- 频率比标注 -->
  <text x="200" y="70" text-anchor="middle" font-family="monospace" font-size="13" fill="#f472b6">sin(3t + δ)</text>
  <text x="52" y="260" text-anchor="middle" font-family="monospace" font-size="13" fill="#10b981">sin(2t)</text>
  <text x="200" y="40" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#18181b">LISSAJOUS</text>
  <text x="200" y="282" text-anchor="middle" font-family="monospace" font-size="11" fill="#71717a">x = sin(a·t + δ)  ·  y = sin(b·t)  ·  b:a = 2:3</text>
</svg>
