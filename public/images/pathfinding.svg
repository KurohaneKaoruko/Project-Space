<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#fafafa"/>
  <!-- 网格迷宫 -->
  <g>
    <!-- 墙 -->
    <g fill="#18181b">
      <rect x="60" y="80" width="20" height="60"/>
      <rect x="100" y="120" width="80" height="20"/>
      <rect x="160" y="60" width="20" height="60"/>
      <rect x="220" y="100" width="60" height="20"/>
      <rect x="240" y="160" width="20" height="60"/>
      <rect x="120" y="180" width="60" height="20"/>
      <rect x="300" y="60" width="20" height="60"/>
      <rect x="60" y="200" width="20" height="40"/>
    </g>
    <!-- 访问区域（蓝渐变块） -->
    <rect x="80" y="80" width="20" height="20" fill="#1d4ed8"/>
    <rect x="80" y="100" width="20" height="20" fill="#3b6fd8"/>
    <rect x="80" y="120" width="20" height="20" fill="#6b93e0"/>
    <rect x="100" y="100" width="20" height="20" fill="#6b93e0"/>
    <rect x="120" y="100" width="20" height="20" fill="#93b3ea"/>
    <rect x="140" y="100" width="20" height="20" fill="#bfdbfe"/>
    <!-- 最短路径（琥珀圆点） -->
    <g fill="#f59e0b">
      <circle cx="90" cy="90" r="5"/>
      <circle cx="90" cy="130" r="5"/>
      <circle cx="110" cy="90" r="5"/>
      <circle cx="130" cy="90" r="5"/>
      <circle cx="150" cy="90" r="5"/>
    </g>
    <!-- 起终点 -->
    <circle cx="290" cy="230" r="12" fill="#059669"/>
    <text x="290" y="234" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">A</text>
    <circle cx="330" cy="70" r="12" fill="#dc2626"/>
    <text x="330" y="74" text-anchor="middle" font-family="monospace" font-size="10" font-weight="bold" fill="#ffffff">B</text>
  </g>
  <text x="200" y="40" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#18181b">PATHFINDING</text>
  <text x="200" y="282" text-anchor="middle" font-family="monospace" font-size="11" fill="#71717a">f(n) = g(n) + ε·h(n)  ·  A* / DIJKSTRA / BFS</text>
</svg>
