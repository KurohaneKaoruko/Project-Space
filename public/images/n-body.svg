<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#fafafa"/>
  <!-- 恒星 + 轨道 + 行星轨迹 -->
  <g fill="none" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="3 4">
    <circle cx="200" cy="140" r="45"/>
    <circle cx="200" cy="140" r="80"/>
    <circle cx="200" cy="140" r="115"/>
  </g>
  <!-- 拖尾轨迹 -->
  <path d="M 245 140 A 45 45 0 0 1 200 185" fill="none" stroke="#3b82f6" stroke-width="2.5" opacity="0.8"/>
  <path d="M 280 140 A 80 80 0 0 1 200 220" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.7"/>
  <path d="M 85 140 A 115 115 0 0 0 200 255" fill="none" stroke="#f59e0b" stroke-width="2.5" opacity="0.7"/>
  <!-- 中心恒星 -->
  <circle cx="200" cy="140" r="18" fill="#f59e0b"/>
  <circle cx="200" cy="140" r="26" fill="#f59e0b" opacity="0.25"/>
  <!-- 行星 -->
  <circle cx="245" cy="140" r="7" fill="#3b82f6"/>
  <circle cx="160" cy="90" r="5" fill="#10b981"/>
  <circle cx="200" cy="255" r="6" fill="#ef4444"/>
  <!-- 速度矢量 -->
  <line x1="245" y1="140" x2="262" y2="128" stroke="#3b82f6" stroke-width="2" marker-end="true"/>
  <polygon points="266,125 258,127 262,133" fill="#3b82f6"/>
  <text x="200" y="40" text-anchor="middle" font-family="monospace" font-size="20" font-weight="bold" fill="#18181b">N-BODY GRAVITY</text>
  <text x="200" y="282" text-anchor="middle" font-family="monospace" font-size="11" fill="#71717a">F = G·m₁·m₂ / r²  ·  SEMI-IMPLICIT EULER</text>
</svg>
